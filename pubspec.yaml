name: botanica_ar
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.0+12

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  google_generative_ai: ^0.4.7
  http: ^1.2.2
  noise_meter: ^5.0.2
  record: ^5.0.4
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  geolocator: ^12.0.0
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  # State management
  provider: ^6.1.2
  # Auth + cloud
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  # App Check — only the genuine app can call Cloud Functions
  firebase_app_check: ^0.3.1
  # In-app purchase / subscription
  purchases_flutter: ^8.2.1
  # Local LLM
  flutter_gemma: ^0.8.0
  # Markdown rendering for chat bubbles
  flutter_markdown: ^0.7.4+1
  # Brand icons (GitHub, LinkedIn, WhatsApp)
  font_awesome_flutter: ^10.7.0
  # Read the installed app version (for force-update check)
  package_info_plus: ^8.0.2
  # Push notifications via FCM
  firebase_messaging: ^15.1.3
  # Network connectivity monitoring
  connectivity_plus: ^6.0.5
  # Callable Cloud Functions (so LLM keys never ship in the APK)
  cloud_functions: ^5.1.3
  # Contest photos — owner-read-only bucket, see storage.rules
  firebase_storage: ^12.3.2
  # Persist private gallery photos in the app's own directory (camera returns
  # temp files the OS may reclaim)
  path_provider: ^2.1.4
  # Agent voice input (on-device Android speech recognition, fi/en/sv)
  speech_to_text: ^7.0.0
  # Agent voice replies
  flutter_tts: ^4.1.0
  # ── Greenhouse navigation (Phuc, lib/screens/navigation_screen/) ──────────
  # BLE beacon scanning + RSSI fingerprinting for indoor positioning.
  flutter_blue_plus: ^1.35.0
  # Vector maths for A* over the CAD-extracted path graph.
  vector_math: ^2.2.0

dependency_overrides:
  # record_linux 0.7.2 doesn't implement startStream from record_platform_interface 1.5.0.
  # Force the newer linux shim that does, even though we only target Android.
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "logo.png"
  min_sdk_android: 23
  # Adaptive icon: dark-green background fills the circle/square mask
  # so there is no white area around the logo.
  adaptive_icon_background: "#0A1A0F"
  adaptive_icon_foreground: "logo.png"

flutter_native_splash:
  color: "#0A1A0F"          # app background (dark green) instead of white
  image: logo.png
  android_12:
    color: "#0A1A0F"
    image: logo.png
  android: true
  ios: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - logo.png
    - greenhouse.png
    - agent_assets/navigation_graph.json
    # Floor-plan PNGs loaded by navigation_view.dart. The CAD and PDF sources
    # that used to sit here moved to /resources/cad on 2026-08-24 — ~12 MB of
    # APK for files no code ever opened. See assets/maps/README.md before
    # putting anything back in this directory.
    - assets/maps/
    # Agent vocabularies + the greenhouse cell labels extracted from the CAD.
    - agent_assets/greenhouse_cells.geojson
    # Curated plant tags (380 rows) + the full plant->section index (11.5k rows).
    # Read by lib/data/plant_index.dart; powers tag chips and tour planning.
    - assets/data/
    # NOTE: assets/plant_hunt/ is deliberately NOT bundled. Those garden photos
    # were the location hint; the hint is now a Wikipedia photo fetched on
    # demand, so shipping ~870 KB of images nothing loads would be dead weight.
    # The files stay in the repo in case the hint changes back.

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
